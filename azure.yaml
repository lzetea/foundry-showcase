# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: demo-foundry-showcase
services:
    contoso-travel-hosted:
        project: agents/04_hosted_agent/agent
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
            deployments:
                - model:
                    format: OpenAI
                    name: gpt-5.4-nano
                    version: "2026-03-17"
                  name: gpt-5.4-nano
                  sku:
                    capacity: 2500
                    name: GlobalStandard
infra:
    provider: bicep
    path: ./infra
